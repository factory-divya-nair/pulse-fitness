<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Fitness | Stronger every day</title>
    <script>
      // Set the theme before first paint so light-mode visitors don't see a dark flash. Mirrors src/theme.ts.
      try {
        var stored = localStorage.getItem('pulse-theme')
        var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : light ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
